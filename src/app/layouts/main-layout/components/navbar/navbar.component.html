<nav
  class="sticky top-0 z-50 border-b border-olive/15 bg-background/90 px-4 py-3 backdrop-blur-xl sm:px-6 lg:px-10"
>
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-4">
    <!-- Logo & Website Name -->
    <a routerLink="/timeline" class="flex shrink-0 items-center gap-2.5">
      <span class="flex size-10 items-center justify-center rounded-xl bg-primary/10 text-primary">
        <i class="fa-solid fa-leaf text-xl"></i>
      </span>

      <span class="text-xl font-bold tracking-tight text-text"> Olive </span>
    </a>

    <!-- Navigation Links -->
    <div class="flex items-center justify-center gap-1 sm:gap-3">
      <a
        routerLink="/timeline"
        routerLinkActive="bg-secondary/30 text-text"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-2 rounded-xl px-3 py-2.5 text-sm font-medium text-text-muted transition-all duration-200 hover:bg-secondary/20 hover:text-text sm:px-4"
      >
        <i class="fa-solid fa-house text-base"></i>
        <span class="hidden sm:inline">Feed</span>
      </a>

      <a
        routerLink="/profile"
        routerLinkActive="bg-secondary/30 text-text"
        class="flex items-center gap-2 rounded-xl px-3 py-2.5 text-sm font-medium text-text-muted transition-all duration-200 hover:bg-secondary/20 hover:text-text sm:px-4"
      >
        <i class="fa-regular fa-user text-base"></i>
        <span class="hidden sm:inline">Profile</span>
      </a>

      <a
        routerLink="/notifications"
        routerLinkActive="bg-secondary/30 text-text"
        class="relative flex items-center gap-2 rounded-xl px-3 py-2.5 text-sm font-medium text-text-muted transition-all duration-200 hover:bg-secondary/20 hover:text-text sm:px-4"
      >
        <i class="fa-regular fa-bell text-base"></i>
        <span class="hidden sm:inline">Notifications</span>
      </a>
    </div>

    <!-- Profile Dropdown -->
    <div class="relative shrink-0">
      <button
        type="button"
        (click)="isDropdownOpen = !isDropdownOpen"
        [attr.aria-expanded]="isDropdownOpen"
        aria-label="Open profile menu"
        class="flex items-center gap-2 rounded-full border border-olive/20 bg-surface/70 p-1.5 transition-all duration-200 hover:border-primary/50 hover:bg-secondary/15 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40"
      >
        <img
          [src]="user().photo"
          [alt]="user().name"
          class="size-9 rounded-full border-2 border-secondary object-cover"
        />

        <i
          class="fa-solid fa-chevron-down mr-1 text-xs text-text-muted transition-transform duration-200"
          [class.rotate-180]="isDropdownOpen"
        ></i>
      </button>

      @if (isDropdownOpen) {
        <div
          class="absolute right-0 top-full mt-3 w-64 overflow-hidden rounded-2xl border border-olive/15 bg-background shadow-xl shadow-olive/10"
        >
          <!-- Profile Info -->
          <div class="flex items-center gap-3 p-4">
            <img
              [src]="user().photo"
              [alt]="user().name"
              class="size-12 rounded-full border-2 border-secondary object-cover"
            />

            <div class="min-w-0">
              <p class="truncate font-semibold text-text">{{ user().name }}</p>

              <p class="truncate text-sm text-text-muted">{{ user().email }}</p>
            </div>
          </div>

          <div class="h-px bg-olive/15"></div>

          <!-- Log Out -->
          <button
            routerLink="changepassword"
            class="flex w-full items-center gap-3 px-4 py-3.5 text-sm font-medium text-text-muted transition-colors duration-200 hover:bg-accent/20 hover:text-text"
          >
            <i class="fa-solid fa-key"></i>
            <span>Change Password</span>
          </button>
          <button
            (click)="logOut()"
            class="flex w-full items-center gap-3 px-4 py-3.5 text-sm font-medium text-text-muted transition-colors duration-200 hover:bg-accent/20 hover:text-text"
          >
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span>Log out</span>
          </button>
        </div>
      }
    </div>
  </div>
</nav>
