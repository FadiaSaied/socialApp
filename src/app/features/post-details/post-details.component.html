<section class="px-3 pt-5 pb-6 sm:px-6">

    <div class="flex items-start gap-3 p-4 sm:p-5">

        [src]="post().user.photo"
        [alt]="post().user.name"
        class="size-11 shrink-0 rounded-full border-2 border-secondary/50 object-cover"
      />

      <div class="min-w-0 flex-1 pt-1">
        <p class="truncate text-sm font-semibold text-text sm:text-base">
          {{ post().user.name }}
        </p>

        <p class="mt-1 truncate text-xs text-text-muted">
          @{{ post().user.username }} · {{ post().createdAt }}
        </p>

    </div>

    <!-- Post Text -->
    @if (post().body) {
      <div class="px-4 pb-4 sm:px-5">
        <p class="whitespace-pre-line wrap-break text-sm leading-6 text-text">
          {{ post().body }}
        </p>
      </div>
    }

    <!-- Post Image -->
    @if (post().image) {
      <div class="w-full overflow-hidden bg-background">
        <img
          [src]="post().image"
          [alt]="post().body || 'Post image'"
          class="max-h-[420px] w-full object-cover"
        />
      </div>
    }

    <!-- Engagement Counts -->
    <div class="flex items-center justify-between gap-3 px-4 py-3 text-xs text-text-muted sm:px-5">
      <span>
        <i class="fa-solid fa-heart mr-1 text-primary"></i>
        {{ post().likesCount }} likes
      </span>

      <span> {{ post().commentsCount }} comments · {{ post().sharesCount }} shares </span>
    </div>

    <div class="mx-4 border-t border-olive/10 sm:mx-5"></div>

    <!-- Actions -->
    <div class="grid grid-cols-3 gap-1 p-2 sm:px-3">
      <button
        type="button"
        class="flex items-center justify-center gap-2 rounded-lg py-2.5 text-xs font-medium text-text-muted transition hover:bg-secondary/15 sm:text-sm"
      >
        <i class="fa-regular fa-heart"></i>
        Like
      </button>

      <button
        #el
        type="button"
        class="flex cursor-pointer items-center justify-center gap-2 rounded-lg py-2.5 text-xs font-medium text-text-muted transition hover:bg-secondary/15 sm:text-sm"
      >
        <i class="fa-regular fa-comment"></i>
        Comment
      </button>

      <button
        type="button"
        class="flex items-center justify-center gap-2 rounded-lg py-2.5 text-xs font-medium text-text-muted transition hover:bg-secondary/15 sm:text-sm"
      >
        <i class="fa-solid fa-share"></i>
        Share
      </button>
    </div>
  </article>

  <!-- Comments -->
  @defer (on interaction(el)) {
    <div
      class="mx-auto mt-4 w-full max-w-3xl overflow-hidden rounded-2xl border border-olive/15 bg-surface shadow-sm"
    >
      <app-comments [postId]="post().id"></app-comments>
    </div>
  }
</section>
