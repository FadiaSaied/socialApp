<section class="rounded-2xl border border-olive/15 bg-surface p-4 shadow-sm">
  <!-- Header -->
  <div class="mb-4 flex items-center justify-between gap-2">
    <h2 class="font-semibold text-text">Suggested Friends</h2>

    <span class="rounded-full bg-secondary/25 px-2.5 py-1 text-xs font-semibold text-text">
      12
    </span>
  </div>

  <!-- Search -->
  <div class="relative mb-5">
    <i
      class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-sm text-text-muted"
    ></i>

    <input
      [(ngModel)]="text"
      type="search"
      placeholder="Search by name..."
      aria-label="Search friends"
      class="w-full rounded-xl border border-olive/15 bg-background py-2.5 pl-9 pr-3 text-sm text-text outline-none placeholder:text-text-muted/80 focus:border-primary/60 focus:ring-2 focus:ring-primary/10"
    />
  </div>

  <!-- Static Friends -->
  <div class="space-y-5">
    @for (follower of allFollowers() | search: text(); track follower._id) {
      <div class="flex items-center gap-3">
        <img
          [src]="follower.photo"
          [alt]="follower.name"
          class="size-10 shrink-0 rounded-full border border-secondary/50 object-cover"
        />

        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-semibold text-text">{{ follower.name }}</p>
          <p class="truncate text-xs text-text-muted">@{{ follower.username }}</p>
          <p class="mt-1 text-xs text-text-muted">{{ follower.followersCount }} followers</p>
          <p class="mt-1 text-xs text-text-muted">
            {{ follower.mutualFollowersCount }} mutual followers
          </p>
        </div>

        <button
          type="button"
          class="shrink-0 rounded-lg border border-primary/30 px-2.5 py-1.5 text-xs font-semibold text-primary transition hover:bg-secondary/20"
        >
          Follow
        </button>
      </div>
    }
  </div>

  <!-- View More -->
  <button
    type="button"
    class="mt-5 w-full rounded-xl bg-secondary/20 py-2.5 text-sm font-semibold text-text transition hover:bg-secondary/35"
  >
    View more
    <i class="fa-solid fa-arrow-right ml-1 text-xs"></i>
  </button>
</section>
